openapi: 3.1.0

info:
  title: FoodMap API
  version: 1.0.0
  description: |
    Hợp đồng API của FoodMap — bản đồ quán ăn, hàng ăn và chợ đồ ăn Việt Nam.

    **File này là nguồn sự thật duy nhất của hợp đồng API.**
    Backend implement theo nó; mobile và admin sinh TypeScript client từ nó.
    Sửa API luôn bắt đầu từ đây — xem skill `api-contract` ở repo cha.

    Ngôn ngữ phản hồi theo header `Accept-Language` (`vi` mặc định, hoặc `en`).
    Trường `message` trong lỗi được dịch; trường `code` thì không.

servers:
  - url: http://localhost:8080
    description: Máy phát triển
  - url: https://api.foodmap.vn
    description: Production

tags:
  - name: auth
    description: Đăng ký, đăng nhập, làm mới token, quên mật khẩu
  - name: user
    description: Hồ sơ người dùng
  - name: place
    description: Địa điểm và tìm kiếm trên bản đồ
  - name: category
    description: Danh mục món ăn
  - name: review
    description: Đánh giá địa điểm
  - name: feedback
    description: Báo thông tin địa điểm sai
  - name: favorite
    description: Danh sách yêu thích
  - name: visit
    description: Ghi nhận lượt đến
  - name: media
    description: Upload ảnh và video
  - name: notification
    description: Thông báo
  - name: chat
    description: Chatbot gợi ý địa điểm
  - name: admin
    description: Chức năng dành cho kiểm duyệt viên và quản trị viên

security:
  - bearerAuth: []

paths:

  # ───────────────────────────── auth ─────────────────────────────

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Đăng ký tài khoản mới
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Đã tạo tài khoản, email xác minh đã được gửi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email đã được đăng ký
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Làm mới access token
      description: |
        Refresh token dùng **một lần**. Mỗi lần gọi sinh cặp token mới và vô hiệu token cũ.
        Dùng lại token đã tiêu sẽ vô hiệu toàn bộ phiên của người dùng đó.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Đăng xuất
      description: Vô hiệu refresh token hiện tại và gỡ push token của thiết bị.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Đã đăng xuất }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Yêu cầu đặt lại mật khẩu
      description: |
        Luôn trả 202 với thông báo **giống hệt nhau**, dù email có tồn tại hay không —
        để không lộ email nào đã đăng ký.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202': { description: Đã tiếp nhận yêu cầu }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Đặt lại mật khẩu bằng token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Đã đổi mật khẩu, mọi phiên cũ bị vô hiệu }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Xác minh email bằng token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Email đã được xác minh }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      summary: Gửi lại email xác minh
      responses:
        '202': { description: Đã tiếp nhận yêu cầu }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── user ─────────────────────────────

  /api/v1/me:
    get:
      tags: [user]
      operationId: getCurrentUser
      summary: Lấy hồ sơ của chính mình
      responses:
        '200':
          description: Hồ sơ người dùng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [user]
      operationId: updateCurrentUser
      summary: Cập nhật hồ sơ của chính mình
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserProfileRequest' }
      responses:
        '200':
          description: Hồ sơ sau khi cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [user]
      operationId: deleteCurrentUser
      summary: Yêu cầu xoá tài khoản
      description: Xoá mềm ngay, xoá cứng sau 30 ngày. Review đã duyệt được giữ và ẩn danh tác giả.
      responses:
        '204': { description: Đã tiếp nhận yêu cầu xoá }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ──────────────────────────── place ─────────────────────────────

  /api/v1/places/nearby:
    get:
      tags: [place]
      operationId: searchNearbyPlaces
      summary: Tìm địa điểm quanh một toạ độ
      description: |
        Trả về địa điểm trong bán kính cho trước, **sắp xếp theo khoảng cách tăng dần**.

        Bán kính vượt `50000` trả **400** `RADIUS_OUT_OF_RANGE` — không âm thầm cắt bớt.
      security: []
      parameters:
        - name: latitude
          in: query
          required: true
          description: Vĩ độ của điểm gốc
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          description: Kinh độ của điểm gốc
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: radiusMeters
          in: query
          description: Bán kính tìm kiếm, đơn vị mét
          schema: { type: integer, minimum: 100, maximum: 50000, default: 2000 }
        - name: placeType
          in: query
          description: Lọc theo loại địa điểm
          schema: { $ref: '#/components/schemas/PlaceType' }
        - name: categorySlugs
          in: query
          description: Lọc theo một hoặc nhiều danh mục
          schema:
            type: array
            items: { type: string }
        - name: minRating
          in: query
          description: Điểm trung bình tối thiểu
          schema: { type: number, format: double, minimum: 1, maximum: 5 }
        - name: openNow
          in: query
          description: Chỉ lấy địa điểm đang mở cửa tại thời điểm truy vấn
          schema: { type: boolean }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách địa điểm gần nhất
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfPlaceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/places:
    get:
      tags: [place]
      operationId: searchPlaces
      summary: Tìm địa điểm theo từ khoá
      description: Tìm trên tên và mô tả, không phân biệt hoa thường và không phân biệt dấu.
      security: []
      parameters:
        - name: query
          in: query
          description: Từ khoá tìm kiếm
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: placeType
          in: query
          schema: { $ref: '#/components/schemas/PlaceType' }
        - name: categorySlugs
          in: query
          schema:
            type: array
            items: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Kết quả tìm kiếm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfPlaceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [place]
      operationId: suggestPlace
      summary: Đề xuất một địa điểm mới
      description: Đề xuất vào trạng thái `DRAFT`, hiển thị công khai sau khi moderator duyệt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuggestPlaceRequest' }
      responses:
        '201':
          description: Đã ghi nhận đề xuất
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/places/{placeId}:
    get:
      tags: [place]
      operationId: getPlaceById
      summary: Lấy chi tiết một địa điểm
      security: []
      parameters:
        - $ref: '#/components/parameters/PlaceIdParam'
      responses:
        '200':
          description: Chi tiết địa điểm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── category ───────────────────────────

  /api/v1/categories:
    get:
      tags: [category]
      operationId: listCategories
      summary: Lấy toàn bộ danh mục món ăn
      security: []
      responses:
        '200':
          description: Danh sách danh mục, sắp xếp theo displayOrder
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  # ──────────────────────────── review ────────────────────────────

  /api/v1/places/{placeId}/reviews:
    get:
      tags: [review]
      operationId: listPlaceReviews
      summary: Lấy đánh giá của một địa điểm
      description: Chỉ trả review đã duyệt, trừ review của chính người gọi (luôn thấy kèm nhãn trạng thái).
      security: []
      parameters:
        - $ref: '#/components/parameters/PlaceIdParam'
        - name: sort
          in: query
          schema:
            type: string
            enum: [NEWEST, HIGHEST_RATING, LOWEST_RATING]
            default: NEWEST
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách đánh giá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfReview' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [review]
      operationId: submitReview
      summary: Gửi hoặc cập nhật đánh giá cho một địa điểm
      description: |
        Mỗi người dùng chỉ có **một** đánh giá cho mỗi địa điểm.
        Gửi lại là **cập nhật** đánh giá cũ, không tạo bản ghi mới.
        Đánh giá đang `APPROVED` bị sửa sẽ quay về `PENDING`.
      parameters:
        - $ref: '#/components/parameters/PlaceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitReviewRequest' }
      responses:
        '201':
          description: Đã tạo đánh giá mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '200':
          description: Đã cập nhật đánh giá sẵn có
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Email chưa được xác minh
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/reviews/{reviewId}:
    delete:
      tags: [review]
      operationId: deleteOwnReview
      summary: Xoá đánh giá của chính mình
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Đã xoá, điểm trung bình được tính lại }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/me/reviews:
    get:
      tags: [review]
      operationId: listOwnReviews
      summary: Lấy đánh giá của chính mình
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách đánh giá của người gọi, mọi trạng thái
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfReview' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── feedback ───────────────────────────

  /api/v1/places/{placeId}/feedbacks:
    post:
      tags: [feedback]
      operationId: submitFeedback
      summary: Báo thông tin địa điểm sai
      description: |
        Feedback **không** hiển thị công khai.
        Đã có feedback cùng loại đang `OPEN` cho địa điểm này thì trả **409**
        kèm `existingFeedbackId`.
      parameters:
        - $ref: '#/components/parameters/PlaceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitFeedbackRequest' }
      responses:
        '201':
          description: Đã ghi nhận
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Đã có feedback cùng loại đang mở
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/v1/me/feedbacks:
    get:
      tags: [feedback]
      operationId: listOwnFeedbacks
      summary: Lấy feedback của chính mình
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách feedback của người gọi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfFeedback' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── favorite ───────────────────────────

  /api/v1/me/favorites:
    get:
      tags: [favorite]
      operationId: listFavorites
      summary: Lấy danh sách yêu thích
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [RECENTLY_ADDED, DISTANCE]
            default: RECENTLY_ADDED
        - name: latitude
          in: query
          description: Bắt buộc khi sort = DISTANCE
          schema: { type: number, format: double }
        - name: longitude
          in: query
          description: Bắt buộc khi sort = DISTANCE
          schema: { type: number, format: double }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách địa điểm yêu thích
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfPlaceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/favorites/{placeId}:
    put:
      tags: [favorite]
      operationId: addFavorite
      summary: Thêm một địa điểm vào danh sách yêu thích
      description: Idempotent — gọi lại với địa điểm đã yêu thích vẫn trả 200.
      parameters:
        - $ref: '#/components/parameters/PlaceIdParam'
      responses:
        '200': { description: Địa điểm đang nằm trong danh sách yêu thích }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [favorite]
      operationId: removeFavorite
      summary: Bỏ một địa điểm khỏi danh sách yêu thích
      parameters:
        - $ref: '#/components/parameters/PlaceIdParam'
      responses:
        '204': { description: Đã bỏ khỏi danh sách }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ──────────────────────────── visit ─────────────────────────────

  /api/v1/places/{placeId}/visits:
    post:
      tags: [visit]
      operationId: recordVisit
      summary: Ghi nhận đã đến một địa điểm
      description: |
        Yêu cầu toạ độ hiện tại nằm trong **200m** quanh địa điểm, và tối đa
        **1 lượt / người / địa điểm / ngày** theo giờ `Asia/Ho_Chi_Minh`.

        Mã lỗi: `VISIT_TOO_FAR` · `VISIT_ALREADY_TODAY`.
      parameters:
        - $ref: '#/components/parameters/PlaceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordVisitRequest' }
      responses:
        '201':
          description: Đã ghi nhận lượt đến
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Visit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Quá xa địa điểm, hoặc đã ghi nhận trong ngày hôm nay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/v1/me/visits:
    get:
      tags: [visit]
      operationId: listOwnVisits
      summary: Lấy lịch sử đã đến của chính mình
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Lịch sử lượt đến
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfVisit' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ──────────────────────────── media ─────────────────────────────

  /api/v1/media/upload-url:
    post:
      tags: [media]
      operationId: createMediaUploadUrl
      summary: Xin presigned URL để upload media
      description: |
        Client upload **thẳng** lên object storage bằng URL trả về; file không đi qua backend.
        Upload xong phải gọi `confirmMediaUpload` để backend xác minh và ghi nhận.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMediaUploadUrlRequest' }
      responses:
        '201':
          description: URL upload đã được cấp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUploadUrl' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/media/{mediaId}/confirm:
    post:
      tags: [media]
      operationId: confirmMediaUpload
      summary: Báo đã upload xong để backend xác minh file
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: File hợp lệ, đã ghi nhận
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '400':
          description: File không hợp lệ (sai loại hoặc quá kích thước cho phép)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── notification ─────────────────────────

  /api/v1/me/notifications:
    get:
      tags: [notification]
      operationId: listNotifications
      summary: Lấy danh sách thông báo
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfNotification' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/notifications/read:
    post:
      tags: [notification]
      operationId: markNotificationsRead
      summary: Đánh dấu thông báo đã đọc
      description: Truyền danh sách id, hoặc bỏ trống để đánh dấu tất cả.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notificationIds:
                  type: array
                  description: Bỏ trống hoặc rỗng nghĩa là đánh dấu tất cả
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Đã đánh dấu }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/notification-settings:
    get:
      tags: [notification]
      operationId: getNotificationSettings
      summary: Lấy cấu hình nhận thông báo đẩy
      responses:
        '200':
          description: Cấu hình hiện tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [notification]
      operationId: updateNotificationSettings
      summary: Cập nhật cấu hình nhận thông báo đẩy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200':
          description: Cấu hình sau khi cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/push-tokens:
    post:
      tags: [notification]
      operationId: registerPushToken
      summary: Đăng ký push token của thiết bị
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPushTokenRequest' }
      responses:
        '204': { description: Đã đăng ký }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── chat ─────────────────────────────

  /api/v1/chat/messages:
    post:
      tags: [chat]
      operationId: sendChatMessage
      summary: Gửi tin nhắn cho chatbot
      description: |
        Trả về **Server-Sent Events**. Mỗi sự kiện là một JSON theo schema `ChatStreamEvent`.

        Chatbot chỉ trả lời dựa trên dữ liệu thật của FoodMap (qua tool nội bộ).
        Không tìm thấy thì nói rõ là không tìm thấy — không bịa địa điểm.

        Giới hạn 30 tin nhắn / người / giờ.
      parameters:
        - name: Accept
          in: header
          required: true
          schema: { type: string, enum: ['text/event-stream'] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendChatMessageRequest' }
      responses:
        '200':
          description: Luồng SSE chứa câu trả lời
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/ChatStreamEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Dịch vụ AI tạm thời không khả dụng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/v1/chat/sessions/current:
    get:
      tags: [chat]
      operationId: getCurrentChatSession
      summary: Lấy lịch sử phiên chat hiện tại
      responses:
        '200':
          description: Phiên chat và các tin nhắn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [chat]
      operationId: clearChatSession
      summary: Xoá lịch sử phiên chat hiện tại
      responses:
        '204': { description: Đã xoá lịch sử }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── admin ────────────────────────────

  /api/v1/admin/reviews:
    get:
      tags: [admin]
      operationId: listReviewsForModeration
      summary: Lấy hàng chờ kiểm duyệt đánh giá
      description: Yêu cầu vai trò `MODERATOR` hoặc `ADMIN`.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReviewStatus' }
        - name: placeId
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema:
            type: string
            enum: [OLDEST_FIRST, NEWEST_FIRST]
            default: OLDEST_FIRST
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Hàng chờ kiểm duyệt, kèm ngữ cảnh về tác giả
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfModerationReview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/reviews/{reviewId}/moderate:
    post:
      tags: [admin]
      operationId: moderateReview
      summary: Duyệt, từ chối hoặc ẩn một đánh giá
      description: |
        Hành động `REJECT` **bắt buộc** kèm `moderationNote`; thiếu thì trả 400
        `MODERATION_NOTE_REQUIRED`.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerateReviewRequest' }
      responses:
        '200':
          description: Đánh giá sau khi kiểm duyệt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Đánh giá đã được người khác xử lý
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/v1/admin/feedbacks:
    get:
      tags: [admin]
      operationId: listFeedbacksForModeration
      summary: Lấy hàng chờ xử lý feedback
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FeedbackStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/FeedbackType' }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách feedback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfFeedback' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/feedbacks/{feedbackId}/resolve:
    post:
      tags: [admin]
      operationId: resolveFeedback
      summary: Xử lý một feedback
      parameters:
        - name: feedbackId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveFeedbackRequest' }
      responses:
        '200':
          description: Feedback sau khi xử lý
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/places:
    post:
      tags: [admin]
      operationId: createPlace
      summary: Tạo địa điểm mới
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertPlaceRequest' }
      responses:
        '201':
          description: Địa điểm đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/places/{placeId}:
    put:
      tags: [admin]
      operationId: updatePlace
      summary: Cập nhật một địa điểm
      parameters:
        - $ref: '#/components/parameters/PlaceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertPlaceRequest' }
      responses:
        '200':
          description: Địa điểm sau khi cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      operationId: deletePlace
      summary: Xoá một địa điểm
      description: Xoá mềm. Hành động không hoàn tác được — giao diện phải xác nhận trước.
      parameters:
        - $ref: '#/components/parameters/PlaceIdParam'
      responses:
        '204': { description: Đã xoá }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Lấy danh sách người dùng
      description: Chỉ vai trò `ADMIN`.
      parameters:
        - name: query
          in: query
          description: Tìm theo email hoặc tên hiển thị
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Danh sách người dùng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfUserProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/users/{userId}/role:
    put:
      tags: [admin]
      operationId: updateUserRole
      summary: Gán vai trò cho người dùng
      description: Chỉ vai trò `ADMIN`.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '200':
          description: Người dùng sau khi đổi vai trò
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/stats:
    get:
      tags: [admin]
      operationId: getAdminStats
      summary: Lấy số liệu thống kê tổng quan
      responses:
        '200':
          description: Thống kê
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStats' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ═══════════════════════════ components ═══════════════════════════

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      description: Số trang, bắt đầu từ 0
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      name: size
      in: query
      description: Số phần tử mỗi trang
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PlaceIdParam:
      name: placeId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TooManyRequests:
      description: Vượt quá giới hạn tốc độ
      headers:
        Retry-After:
          description: Số giây cần chờ trước khi thử lại
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:

    # ── chung ──

    ApiError:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          description: |
            Mã lỗi ổn định, `SCREAMING_SNAKE_CASE`. **Không được dịch** —
            client so sánh bằng mã này, không bằng `message`.
          examples: [PLACE_NOT_FOUND, VISIT_TOO_FAR, MODERATION_NOTE_REQUIRED]
        message:
          type: string
          description: Thông báo cho người dùng, **đã dịch** theo `Accept-Language`
        details:
          type: array
          description: Chi tiết lỗi theo từng trường, dùng cho lỗi validation
          items: { $ref: '#/components/schemas/FieldError' }
        traceId:
          type: string
          description: Mã truy vết để đối chiếu với log phía server

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    Locale:
      type: string
      enum: [vi, en]

    # ── auth & user ──

    UserRole:
      type: string
      enum: [USER, MODERATOR, ADMIN]

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password:
          type: string
          minLength: 8
          maxLength: 100
          description: Tối thiểu 8 ký tự, có ít nhất một chữ cái và một chữ số
        displayName: { type: string, minLength: 1, maxLength: 100 }
        preferredLocale: { $ref: '#/components/schemas/Locale' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
        pushToken:
          type: string
          description: Push token của thiết bị này, để gỡ đăng ký

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 100 }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn:
          type: integer
          description: Thời gian sống của access token, đơn vị giây
        user: { $ref: '#/components/schemas/UserProfile' }

    UserProfile:
      type: object
      required: [id, email, displayName, role, preferredLocale, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/UserRole' }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }

    UpdateUserProfileRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        avatarUrl: { type: string, nullable: true }
        preferredLocale: { $ref: '#/components/schemas/Locale' }

    PageOfUserProfile:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/UserProfile' }

    # ── place ──

    PlaceType:
      type: string
      enum: [RESTAURANT, STREET_FOOD, FOOD_MARKET, CAFE]

    PlaceStatus:
      type: string
      enum: [DRAFT, PUBLISHED, TEMPORARILY_CLOSED, PERMANENTLY_CLOSED]

    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }

    Category:
      type: object
      required: [id, slug, name, displayOrder]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name:
          type: string
          description: Đã dịch theo `Accept-Language`; thiếu bản `en` thì trả bản `vi`
        icon: { type: string, nullable: true }
        displayOrder: { type: integer }

    OpeningHourRange:
      type: object
      required: [dayOfWeek, isClosedAllDay]
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 = thứ Hai … 7 = Chủ nhật (ISO-8601)
        openTime:
          type: string
          nullable: true
          description: Định dạng HH:mm. `null` khi nghỉ cả ngày
          examples: ['06:00']
        closeTime:
          type: string
          nullable: true
          description: Nhỏ hơn `openTime` nghĩa là qua nửa đêm
          examples: ['10:30']
        isClosedAllDay: { type: boolean }

    PlaceSummary:
      type: object
      required: [id, slug, name, placeType, coordinates, status, reviewCount, visitCount, categories]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name:
          type: string
          description: Đã dịch; thiếu bản `en` thì trả bản `vi`
        placeType: { $ref: '#/components/schemas/PlaceType' }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        address: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/PlaceStatus' }
        averageRating:
          type: number
          format: double
          nullable: true
          description: '**`null` khi chưa có đánh giá nào — không phải `0`.**'
        reviewCount: { type: integer }
        visitCount: { type: integer, format: int64 }
        coverImageUrl: { type: string, nullable: true }
        distanceMeters:
          type: number
          format: double
          nullable: true
          description: Chỉ có mặt ở kết quả tìm theo vị trí
        isOpenNow:
          type: boolean
          nullable: true
          description: Tính theo giờ `Asia/Ho_Chi_Minh` tại thời điểm truy vấn
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    PlaceDetail:
      allOf:
        - $ref: '#/components/schemas/PlaceSummary'
        - type: object
          required: [openingHours, images, distinctVisitorCount, createdAt]
          properties:
            description: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            distinctVisitorCount: { type: integer, format: int64 }
            nextOpenAt:
              type: string
              format: date-time
              nullable: true
              description: Thời điểm mở cửa tiếp theo khi hiện đang đóng
            openingHours:
              type: array
              items: { $ref: '#/components/schemas/OpeningHourRange' }
            images:
              type: array
              items: { $ref: '#/components/schemas/Media' }
            isFavorited:
              type: boolean
              nullable: true
              description: Chỉ có mặt khi người gọi đã đăng nhập
            ownVisitCount:
              type: integer
              nullable: true
              description: Số lượt đến của chính người gọi; chỉ có khi đã đăng nhập
            createdAt: { type: string, format: date-time }

    PageOfPlaceSummary:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/PlaceSummary' }

    PlaceTranslation:
      type: object
      required: [locale, name]
      properties:
        locale: { $ref: '#/components/schemas/Locale' }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, nullable: true }

    SuggestPlaceRequest:
      type: object
      required: [placeType, coordinates, translations]
      properties:
        placeType: { $ref: '#/components/schemas/PlaceType' }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        address: { type: string, nullable: true, maxLength: 500 }
        phone: { type: string, nullable: true, maxLength: 20 }
        categorySlugs:
          type: array
          items: { type: string }
        translations:
          type: array
          minItems: 1
          description: Bản `vi` là **bắt buộc**; bản `en` tuỳ chọn
          items: { $ref: '#/components/schemas/PlaceTranslation' }

    UpsertPlaceRequest:
      allOf:
        - $ref: '#/components/schemas/SuggestPlaceRequest'
        - type: object
          properties:
            status: { $ref: '#/components/schemas/PlaceStatus' }
            openingHours:
              type: array
              items: { $ref: '#/components/schemas/OpeningHourRange' }
            imageMediaIds:
              type: array
              items: { type: string, format: uuid }

    # ── review ──

    ReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, HIDDEN]

    ReviewAuthor:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }

    Review:
      type: object
      required: [id, placeId, author, rating, locale, status, media, createdAt]
      properties:
        id: { type: string, format: uuid }
        placeId: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/ReviewAuthor' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, nullable: true }
        locale:
          { $ref: '#/components/schemas/Locale' }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        moderationNote:
          type: string
          nullable: true
          description: Chỉ trả về cho tác giả và cho moderator
        media:
          type: array
          items: { $ref: '#/components/schemas/Media' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }

    SubmitReviewRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, nullable: true, maxLength: 2000 }
        mediaIds:
          type: array
          maxItems: 6
          description: Tối đa 5 ảnh và 1 video
          items: { type: string, format: uuid }

    PageOfReview:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Review' }

    ModerationReview:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          required: [placeName, authorRejectedCount]
          properties:
            placeName: { type: string }
            authorRejectedCount:
              type: integer
              description: Số đánh giá của tác giả này đã bị từ chối trước đó

    PageOfModerationReview:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/ModerationReview' }

    ModerateReviewRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT, HIDE, UNHIDE]
        moderationNote:
          type: string
          nullable: true
          maxLength: 1000
          description: '**Bắt buộc khi `action = REJECT`.**'

    # ── feedback ──

    FeedbackType:
      type: string
      enum: [WRONG_ADDRESS, WRONG_HOURS, CLOSED_PERMANENTLY, DUPLICATE, INAPPROPRIATE, OTHER]

    FeedbackStatus:
      type: string
      enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED]

    Feedback:
      type: object
      required: [id, placeId, type, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        placeId: { type: string, format: uuid }
        placeName: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/FeedbackType' }
        description: { type: string, nullable: true }
        duplicateOfPlaceId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/FeedbackStatus' }
        resolutionNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    SubmitFeedbackRequest:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/FeedbackType' }
        description: { type: string, nullable: true, maxLength: 1000 }
        duplicateOfPlaceId:
          type: string
          format: uuid
          nullable: true
          description: Chỉ dùng khi `type = DUPLICATE`

    ResolveFeedbackRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [IN_REVIEW, RESOLVED, DISMISSED]
        resolutionNote: { type: string, nullable: true, maxLength: 1000 }

    PageOfFeedback:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Feedback' }

    # ── visit ──

    Visit:
      type: object
      required: [id, placeId, visitDate, distanceMeters, createdAt]
      properties:
        id: { type: string, format: uuid }
        placeId: { type: string, format: uuid }
        placeName: { type: string, nullable: true }
        visitDate:
          type: string
          format: date
          description: Ngày theo giờ `Asia/Ho_Chi_Minh`
        distanceMeters: { type: integer }
        createdAt: { type: string, format: date-time }

    RecordVisitRequest:
      type: object
      required: [coordinates]
      properties:
        coordinates: { $ref: '#/components/schemas/Coordinates' }

    PageOfVisit:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Visit' }

    # ── media ──

    MediaType:
      type: string
      enum: [IMAGE, VIDEO]

    Media:
      type: object
      required: [id, mediaType, url]
      properties:
        id: { type: string, format: uuid }
        mediaType: { $ref: '#/components/schemas/MediaType' }
        url: { type: string, description: Bản hiển thị, cạnh dài 1600px }
        thumbnailUrl: { type: string, nullable: true, description: Bản 400px }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        durationSeconds: { type: integer, nullable: true }

    CreateMediaUploadUrlRequest:
      type: object
      required: [mediaType, contentType, sizeBytes]
      properties:
        mediaType: { $ref: '#/components/schemas/MediaType' }
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, video/mp4]
        sizeBytes:
          type: integer
          format: int64
          description: Ảnh tối đa 10 MB, video tối đa 100 MB

    MediaUploadUrl:
      type: object
      required: [mediaId, uploadUrl, expiresAt]
      properties:
        mediaId: { type: string, format: uuid }
        uploadUrl: { type: string, description: Presigned URL, dùng phương thức PUT }
        expiresAt: { type: string, format: date-time }

    # ── notification ──

    NotificationType:
      type: string
      enum:
        - REVIEW_APPROVED
        - REVIEW_REJECTED
        - FEEDBACK_RESOLVED
        - NEW_PLACE_NEARBY
        - PLACE_UPDATED
        - SYSTEM_ANNOUNCEMENT

    Notification:
      type: object
      required: [id, type, title, isRead, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string, description: Đã dịch theo ngôn ngữ ưa thích của người nhận }
        body: { type: string, nullable: true }
        placeId: { type: string, format: uuid, nullable: true }
        reviewId: { type: string, format: uuid, nullable: true }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    PageOfNotification:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content, unreadCount]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Notification' }
            unreadCount: { type: integer }

    NotificationSettings:
      type: object
      required: [enabledTypes]
      properties:
        enabledTypes:
          type: array
          description: Các loại thông báo được phép gửi push
          items: { $ref: '#/components/schemas/NotificationType' }

    RegisterPushTokenRequest:
      type: object
      required: [token, platform]
      properties:
        token: { type: string }
        platform:
          type: string
          enum: [IOS, ANDROID]

    # ── chat ──

    SendChatMessageRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 1000 }
        coordinates:
          allOf:
            - $ref: '#/components/schemas/Coordinates'
          description: Vị trí hiện tại, để chatbot gợi ý quanh đây
        locale:
          allOf:
            - $ref: '#/components/schemas/Locale'
          description: Bỏ trống thì suy ra từ ngôn ngữ của câu hỏi

    ChatStreamEvent:
      type: object
      required: [type]
      description: Một sự kiện trong luồng SSE.
      properties:
        type:
          type: string
          enum: [TEXT_DELTA, PLACE_REFERENCES, DONE, ERROR]
        text:
          type: string
          nullable: true
          description: Có mặt khi `type = TEXT_DELTA`
        placeIds:
          type: array
          nullable: true
          description: Có mặt khi `type = PLACE_REFERENCES`; client render thẻ bấm mở
          items: { type: string, format: uuid }
        messageId:
          type: string
          format: uuid
          nullable: true
          description: Có mặt khi `type = DONE`
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
          nullable: true
          description: Có mặt khi `type = ERROR`

    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [USER, ASSISTANT]
        content: { type: string }
        referencedPlaceIds:
          type: array
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    ChatSession:
      type: object
      required: [id, messages, createdAt]
      properties:
        id: { type: string, format: uuid }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        createdAt: { type: string, format: date-time }

    # ── admin ──

    AdminStats:
      type: object
      required:
        - placesByStatus
        - reviewsByStatus
        - openFeedbackCount
        - newUsersLast30Days
        - topViewedPlaces
      properties:
        placesByStatus:
          type: object
          additionalProperties: { type: integer }
        reviewsByStatus:
          type: object
          additionalProperties: { type: integer }
        openFeedbackCount: { type: integer }
        newUsersLast30Days:
          type: array
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        topViewedPlaces:
          type: array
          items: { $ref: '#/components/schemas/PlaceSummary' }
